<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Flipkart</h2>
        <input type="text" placeholder="Search for products">
        <button>Login</button>
        <span>Cart</span>
    </header>

    <div class="offers">

        <div class="offer">
            <img src="img7.webp" alt="Mobile Deals">
        </div>

        <div class="offer">
            <img src="img2.webp" alt="Fashion Deals">
        </div>

        <div class="offer">
            <img src="img1.webp" alt="Electronics Deals">
        </div>

    </div>

        <div class="banner">
        <img src="bigimg.webp" alt="Shopping Banner">
    </div>



    <h2 class="title">Best of Electronics</h2>

    <div class="products">

        <div class="product">
            <img src="img9.webp" alt="smartphones">
            <div class="product">Smartphone</div>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="img12.webp" alt="Laptops"><br>
            <div class="product-image">Laptop</div><br>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="img13.webp" alt="Headphones"><br>
            <div class="product-image">Headphones</div><br>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="img10.webp" alt="Smartwatch"><br>
            <div class="product-image">Smartwatch</div><br>
            <button>View Product</button>
        </div>

    </div>

    <footer>
    
<div class="extra-footer">
    <div>
        <h3>ABOUT</h3>
        <p>Contact Us</p>
        <p>About Us</p>
        <p>Careers</p>
        <p>Flipkart Stories</p>
    </div>

    <div>
        <h3>HELP</h3>
        <p>Payments</p>
        <p>Shipping</p>
        <p>Cancellation & Returns</p>
        <p>FAQ</p>
    </div>

    <div>
        <h3>CONSUMER POLICY</h3>
        <p>Terms Of Use</p>
        <p>Privacy</p>
        <p>Security</p>
        <p>Sitemap</p>
    </div>

    <div>
        <h3>SOCIAL</h3>
        <p>Facebook</p>
        <p>Instagram</p>
        <p>YouTube</p>
    </div>
</div>
</footer>

</body>
</html>
